<div class="pagination">
  <p class="range" role="status" aria-live="polite" aria-atomic="true">
    {{ range() }}
  </p>

  <label class="page-size">
    <span>Registros por página</span>
    <app-select-control
      [formField]="sizeForm.pageSize"
      [options]="sizeOptions"
      label="Registros por página"
      [searchable]="false"
      [compact]="true"
      (valueChange)="changePageSize($event)"
    />
  </label>

  <nav class="navigation" [attr.aria-label]="'Paginación de ' + label()">
    <button
      class="direction previous"
      type="button"
      aria-label="Página anterior"
      [disabled]="currentPage() === 1 || total() === 0"
      (click)="goToPage(currentPage() - 1)"
    >
      <app-icon name="arrow-left" />
      Anterior
    </button>
    <div class="page-numbers">
      @for (page of pages(); track page) {
        @if (page === 'start-gap' || page === 'end-gap') {
          <span class="ellipsis" aria-hidden="true">…</span>
        } @else {
          <button
            class="page-number"
            type="button"
            [attr.aria-label]="'Ir a la página ' + page"
            [attr.aria-current]="page === currentPage() ? 'page' : null"
            [disabled]="total() === 0"
            (click)="goToPage(page)"
          >
            {{ page }}
          </button>
        }
      }
    </div>
    <button
      class="direction next"
      type="button"
      aria-label="Página siguiente"
      [disabled]="currentPage() === totalPages() || total() === 0"
      (click)="goToPage(currentPage() + 1)"
    >
      Siguiente
      <app-icon name="arrow-right" />
    </button>
  </nav>
</div>
