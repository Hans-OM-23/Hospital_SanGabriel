<button
  #trigger
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  type="button"
  class="select-trigger"
  [class.compact]="compact()"
  [class.placeholder]="!selected()"
  [class.is-open]="open()"
  [class.is-invalid]="invalid() && touched()"
  [id]="controlId()"
  [disabled]="disabled()"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? listId() : null"
  [attr.aria-activedescendant]="!searchable() ? activeId() : null"
  [attr.aria-required]="required()"
  [attr.aria-readonly]="readonly()"
  [attr.aria-invalid]="invalid() && touched()"
  (click)="toggle()"
  (keydown)="onKeydown($event)"
  (focusout)="onFocusOut()"
>
  <app-icon class="leading-icon" name="layers" />
  <span class="selected-label">{{ selected()?.label || placeholder() }}</span>
  <app-icon class="chevron" name="chevron-down" />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayWidth]="panelWidth()"
  [cdkConnectedOverlayViewportMargin]="12"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
  [cdkConnectedOverlayUsePopover]="null"
  (attach)="onAttached()"
  (backdropClick)="onOutsideClick()"
>
  <div #panel class="select-panel" (keydown)="onKeydown($event)" (focusout)="onFocusOut()">
    @if (searchable()) {
      <div class="search-wrap">
        <app-icon name="search" />
        <input
          #search
          type="text"
          class="select-search"
          autocomplete="off"
          [value]="query()"
          [attr.aria-label]="'Buscar en ' + label()"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="true"
          [attr.aria-controls]="listId()"
          [attr.aria-activedescendant]="activeId()"
          placeholder="Buscar una opción..."
          (input)="onQuery($event)"
        />
      </div>
    }
    <div class="options-list" role="listbox" [id]="listId()" [attr.aria-label]="label()">
      @for (option of filteredOptions(); track option.value; let index = $index) {
        <button
          type="button"
          role="option"
          tabindex="-1"
          class="select-option"
          [class.selected]="option.value === value()"
          [class.active]="index === activeIndex()"
          [id]="listId() + '-option-' + index"
          [disabled]="option.disabled"
          [attr.aria-selected]="option.value === value()"
          [attr.aria-disabled]="!!option.disabled"
          (pointermove)="!option.disabled && activeIndex.set(index)"
          (mousedown)="$event.preventDefault()"
          (click)="choose(option)"
        >
          <span class="option-text">
            <span class="option-label">{{ option.label }}</span>
            @if (option.description) {
              <span class="option-description">{{ option.description }}</span>
            }
          </span>
          @if (option.value === value()) {
            <app-icon name="check" />
          }
        </button>
      } @empty {
        <div class="no-results" role="status">
          <app-icon name="search" />
          <span>No hay coincidencias</span>
          <small>Prueba con otro término de búsqueda.</small>
        </div>
      }
    </div>
    @if (searchable() && filteredOptions().length) {
      <div class="select-hint">Usa ↑ ↓ para navegar y Enter para seleccionar</div>
    }
  </div>
</ng-template>
